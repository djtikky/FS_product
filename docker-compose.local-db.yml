services:

  backend:

    build:

      context: ./backend

    container_name: product-api

    environment:

      NODE_ENV: production

      PORT: 5000


      # ใช้ PostgreSQL ที่รันอยู่บนเครื่องเรา

      DB_HOST: host.docker.internal

      DB_PORT: 5432

      DB_NAME: productdb

      DB_USER: postgres

      DB_PASSWORD: postgres

    ports:

      - "5000:5000"