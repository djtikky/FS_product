name: CI/CD Pipeline


on:

  push:

    branches: [ main ]


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - name: Setup Node.js

        uses: actions/setup-node@v3

        with:

          node-version: '20'

      - name: Install & Test Backend

        run: |

          cd backend

          npm install

          npm test


  build-and-push:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      # ตรงนี้คุณสามารถเพิ่มขั้นตอน Docker build & push ได้

      # หากคุณมี Docker Hub account

      - name: Build Docker Images

        run: docker compose build