name: CI/CD Pipeline


on:

  push:

    branches: [ main ]


jobs:

  test-backend:

    runs-on: ubuntu-latest

    services:

      db:

        image: postgres:16-alpine

        env:

          POSTGRES_DB: product_db

          POSTGRES_PASSWORD: password

        ports:

          - 5432:5432

    steps:

      - uses: actions/checkout@v3

      - name: Setup Node.js

        uses: actions/setup-node@v3

        with:

          node-version: '20'

      - name: Install & Test Backend

        run: |

          cd backend

          npm install

          npm test
        env:

          DB_HOST: localhost

          DB_PORT: 5432

          DB_NAME: product_db

          DB_USER: postgres

          DB_PASSWORD: postgres 